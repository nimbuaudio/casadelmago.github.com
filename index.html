<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Hogar del Mago</title>
  <style>
    :root {
      --bg-dark: #0e0b12;
      --card-bg: #231a2e;
      --accent-gold: #c89f65;
      --accent-gold-hover: #e2b06f;
      --hotspot-hover: #ffd700;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 1rem; background-color: var(--bg-dark);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: 'Courier New', Courier, monospace;
      color: #f3e9dc; image-rendering: pixelated;
    }

    .house-container {
      position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9;
      background-color: #1a1423;
      background-image: url('./public/Imagenes/1786676817289.png');
      background-size: cover; background-position: center;
      image-rendering: pixelated; border: 4px solid #3d2d47;
      border-radius: 6px; box-shadow: 0 10px 35px rgba(0,0,0,0.85); overflow: hidden;
    }

    .hotspot {
      position: absolute; cursor: pointer; z-index: 20; border-radius: 8px;
      border: 2px solid transparent; background-color: transparent;
      transition: background-color 0.2s ease, border 0.2s ease, box-shadow 0.2s ease;
      outline: none; padding: 0;
    }

    .hotspot:hover, .hotspot:focus-visible {
      background-color: rgba(255, 215, 0, 0.15);
      border: 2px dashed var(--hotspot-hover);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    #spot-herbolario   { top: 15%; left: 3%;  width: 26%; height: 65%; }
    #spot-bosque       { top: 10%; left: 36%; width: 19%; height: 45%; }
    #spot-fuego        { top: 45%; left: 56%; width: 14%; height: 35%; }
    #spot-conocimiento { top: 50%; left: 71%; width: 23%; height: 40%; }
    #spot-musica       { top: 60%; left: 35%; width: 30%; height: 35%; }

    .fireplace-wrapper {
      position: absolute; top: 35.45%; left: 57.5%; width: 16%; height: 35%;
      z-index: 10; pointer-events: none;
    }

    .fireplace-img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
    .fireplace-glow {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 120%; height: 100%;
      border-radius: 50%; background: radial-gradient(circle, rgba(255, 140, 0, 0.35) 0%, rgba(255, 69, 0, 0) 70%);
      animation: ambient-flicker 1.5s ease-in-out infinite alternate; z-index: 9; pointer-events: none;
    }

    @keyframes ambient-flicker {
      0%   { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 1.0; transform: translateX(-50%) scale(1.10); }
    }

    .audio-control-btn {
      position: absolute; top: 15px; right: 15px; z-index: 30;
      background: rgba(35, 26, 46, 0.85); border: 2px solid var(--accent-gold);
      color: var(--accent-gold); border-radius: 50%; width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.2rem; transition: all 0.2s ease;
      backdrop-filter: blur(4px); outline: none;
    }

    .audio-control-btn:hover, .audio-control-btn:focus-visible {
      background: var(--accent-gold); color: var(--bg-dark);
      box-shadow: 0 0 10px rgba(200, 159, 101, 0.5);
    }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 8, 15, 0.85); backdrop-filter: blur(5px); z-index: 100;
      justify-content: center; align-items: center; padding: 15px; opacity: 0; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-card {
      background: var(--card-bg); border: 3px solid var(--accent-gold); border-radius: 12px;
      padding: 20px; max-width: 450px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .modal-title { margin-top: 0; color: var(--accent-gold-hover); border-bottom: 2px solid #3d2d47; padding-bottom: 10px; }
    .modal-img {
      width: 100%; max-height: 240px; object-fit: cover; border-radius: 8px;
      border: 2px solid var(--accent-gold); margin-bottom: 12px; display: block;
      image-rendering: pixelated;
    }
    .close-btn {
      margin-top: 20px; background: var(--accent-gold); color: #120e17;
      border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px;
      cursor: pointer; width: 100%; transition: background 0.2s ease;
    }
    .close-btn:hover { background: var(--accent-gold-hover); }

    .acercarse-btn {
      margin-top: 10px; background: transparent; color: var(--accent-gold);
      border: 2px solid var(--accent-gold); padding: 12px 20px; font-weight: bold;
      border-radius: 6px; cursor: pointer; width: 100%; font-family: inherit;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .acercarse-btn:hover { background: var(--accent-gold); color: var(--bg-dark); }

    /* Pantalla completa de acercamiento (ej. Herbolario) */
    .full-screen-view {
      display: none; position: fixed; inset: 0; z-index: 200;
      background-color: var(--bg-dark);
      justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.3s ease;
      overflow: hidden;
    }
    .full-screen-view.active { display: flex; opacity: 1; }

    .full-screen-media {
      position: relative; overflow: hidden;
      width: 100vw; height: 100vh;
      box-sizing: border-box;
      cursor: grab; touch-action: none; user-select: none;
    }
    .full-screen-media.dragging { cursor: grabbing; }

    .panorama-layer {
      position: absolute; top: 0; left: 0; height: 100vh;
      min-width: 100vw; display: flex; align-items: center;
      will-change: transform;
    }
    .panorama-img {
      height: 100vh; width: auto; min-width: 33.333vw;
      object-fit: cover; display: block; flex-shrink: 0;
      image-rendering: pixelated; -webkit-user-drag: none;
      user-select: none; pointer-events: none;
    }

    .volver-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--accent-gold); color: #120e17; border: none;
      padding: 12px 28px; font-weight: bold; border-radius: 6px; cursor: pointer;
      font-family: inherit; transition: background 0.2s ease; z-index: 210;
    }
    .volver-btn:hover { background: var(--accent-gold-hover); }

    .hotspot-herbolario {
      position: absolute; cursor: pointer; z-index: 205; border-radius: 10px;
      border: 2px solid transparent; background-color: rgba(200, 159, 101, 0.12);
      transition: background-color 0.2s ease, border 0.2s ease, box-shadow 0.2s ease;
      outline: none; padding: 0; display: flex; align-items: flex-end; justify-content: center;
    }
    .hotspot-herbolario:hover, .hotspot-herbolario:focus-visible {
      background-color: rgba(255, 215, 0, 0.18);
      border: 2px dashed var(--hotspot-hover);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
    .hotspot-herbolario .hotspot-label {
      font-size: 0.75rem; color: var(--accent-gold-hover); background: rgba(14, 11, 18, 0.75);
      padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; text-align: center;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .hotspot-herbolario:hover .hotspot-label, .hotspot-herbolario:focus-visible .hotspot-label {
      opacity: 1;
    }

    #spot-plantas-medicinales { top: 2%;  left: 42%; width: 36%; height: 63%; }
    #spot-pociones-tinturas   { top: 32%; left: 0%;  width: 37%; height: 68%; }
    #spot-enciclopedia-py     { top: 55%; left: 67%; width: 33%; height: 45%; }

    /* --- Grimorio de plantas --- */
    .grimorio-screen {
      display: none; position: fixed; inset: 0; z-index: 300;
      background-color: #050407;
      justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .grimorio-screen.active { display: flex; opacity: 1; }

    .grimorio-book {
      position: relative;
      width: min(96vw, 1376px);
      aspect-ratio: 1376 / 768;
      background-image: url('./public/Imagenes/grimorio-fondo.webp');
      background-size: contain; background-repeat: no-repeat; background-position: center;
      image-rendering: pixelated;
    }

    .grimorio-page-left, .grimorio-page-right {
      position: absolute; top: 11%; height: 74%;
      display: flex; flex-direction: column;
    }
    .grimorio-page-left  { left: 12%; width: 35%; }
    .grimorio-page-right { left: 53%; width: 35%; }

    .grimorio-img-wrap {
      flex: 1 1 auto; min-height: 0; border-radius: 4px; overflow: hidden;
      margin-bottom: 8px;
    }
    .grimorio-img-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: sepia(0.15) contrast(1.02);
    }

    .grimorio-badges {
      display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
    }
    .grimorio-badge {
      font-size: 0.65rem; color: #6b4a26; background: rgba(107, 74, 38, 0.12);
      border: 1px solid #6b4a26; padding: 2px 8px; border-radius: 20px;
    }

    .grimorio-nombre { color: #3a2a17; font-size: 1.05rem; margin: 0 0 2px; text-align: center; }
    .grimorio-cientifico { color: #6b4a26; font-size: 0.75rem; font-style: italic; margin: 0 0 10px; text-align: center; }

    .grimorio-seccion { margin-bottom: 10px; overflow-y: auto; }
    .grimorio-seccion-titulo {
      font-size: 0.7rem; color: #6b4a26; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(107, 74, 38, 0.4); padding-bottom: 2px; margin-bottom: 4px;
    }
    .grimorio-seccion-texto { font-size: 0.78rem; line-height: 1.5; color: #3a2a17; }

    .grimorio-nav {
      position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px; z-index: 305;
    }
    .grimorio-nav-btn {
      background: var(--card-bg); border: 2px solid var(--accent-gold); color: var(--accent-gold);
      width: 34px; height: 30px; border-radius: 6px; cursor: pointer; font-family: inherit;
    }
    .grimorio-nav-btn:hover { background: var(--accent-gold); color: var(--bg-dark); }
    .grimorio-nav-contador { font-size: 0.75rem; color: var(--accent-gold-hover); }

    .grimorio-cerrar-btn {
      position: absolute; top: 15px; right: 15px; z-index: 305;
      background: rgba(35, 26, 46, 0.85); border: 2px solid var(--accent-gold);
      color: var(--accent-gold); border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem;
    }
    .grimorio-cerrar-btn:hover { background: var(--accent-gold); color: var(--bg-dark); }

    /* Estilos responsivos del reproductor */
    .pixel-player {
      background: #15101d;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }
    .player-track-info {
      font-size: 0.85rem;
      color: var(--accent-gold-hover);
      text-align: center;
      word-break: break-word;
      white-space: normal;
      line-height: 1.3;
    }
    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .player-volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .volume-icon {
      font-size: 0.9rem;
      color: var(--accent-gold);
    }
    .player-btn {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      flex: 1;
      max-width: 90px;
      text-align: center;
      transition: background 0.2s ease;
    }
    .player-btn:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
    }
    .player-slider {
      width: 100%;
      accent-color: var(--accent-gold);
      cursor: pointer;
      margin: 0;
    }
  </style>
</head>
<body>

  <main class="house-container">
    <button id="toggle-audio-btn" class="audio-control-btn" onclick="toggleAudio()" aria-label="Activar o desactivar música de fondo" title="Música ambiental">
      🔊
    </button>

    <div class="fireplace-wrapper">
      <div class="fireplace-glow"></div>
      <img id="fireplace-img" src="./public/Imagenes/Animacion-chimenea/chimenea1.png" alt="Chimenea" class="fireplace-img">
    </div>

    <button id="spot-herbolario" class="hotspot" onclick="abrirSeccion('herbolario')" aria-label="Abrir Herbolario"></button>
    <button id="spot-bosque" class="hotspot" onclick="abrirSeccion('bosque')" aria-label="Ir al Bosque"></button>
    <button id="spot-fuego" class="hotspot" onclick="abrirSeccion('fuego')" aria-label="Ver el Fuego"></button>
    <button id="spot-musica" class="hotspot" onclick="abrirSeccion('musica')" aria-label="Abrir Reproductor de Música"></button>
    <button id="spot-conocimiento" class="hotspot" onclick="abrirSeccion('conocimiento')" aria-label="Consultar Conocimiento"></button>
  </main>

  <div id="modal" class="modal-overlay" onclick="if(event.target.id==='modal') cerrarModal()" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h2 id="modal-title" class="modal-title">Título</h2>
      <div id="modal-body">Cargando...</div>
      <button class="close-btn" onclick="cerrarModal()">Regresar a la Casa</button>
    </div>
  </div>

  <div id="herbolario-screen" class="full-screen-view" role="dialog" aria-modal="true" aria-label="Herbolario, vista de acercamiento">
    <div class="full-screen-media" id="herbolario-viewport">
      <div class="panorama-layer" id="herbolario-panorama-layer">
        <img class="panorama-img herbolario-panel" src="./public/Imagenes/herbolario-izquierda.webp" alt="Herbolario, panel izquierdo" draggable="false">
        <img class="panorama-img herbolario-panel" src="./public/Imagenes/herbolario-centro.webp" alt="Herbolario, panel central" draggable="false">
        <img class="panorama-img herbolario-panel" src="./public/Imagenes/herbolario-derecha.webp" alt="Herbolario, panel derecho" draggable="false">
        <button id="spot-plantas-medicinales" class="hotspot-herbolario" onclick="abrirGrimorio()" aria-label="Plantas Medicinales">
          <span class="hotspot-label">Plantas Medicinales</span>
        </button>
        <button id="spot-pociones-tinturas" class="hotspot-herbolario" onclick="abrirSeccion('pociones-tinturas')" aria-label="Pociones y Tinturas">
          <span class="hotspot-label">Pociones y Tinturas</span>
        </button>
        <button id="spot-enciclopedia-py" class="hotspot-herbolario" onclick="abrirSeccion('enciclopedia-py')" aria-label="Enciclopedia de Plantas Silvestres de Paraguay">
          <span class="hotspot-label">Enciclopedia de Plantas Silvestres de Paraguay</span>
        </button>
      </div>
      <button class="volver-btn" onclick="cerrarHerbolarioScreen()">Volver a la Casa</button>
    </div>
  </div>

  <div id="grimorio-screen" class="grimorio-screen" role="dialog" aria-modal="true" aria-label="Grimorio de plantas medicinales">
    <button class="grimorio-cerrar-btn" onclick="cerrarGrimorio()" aria-label="Cerrar grimorio">
      &#10005;
    </button>
    <div class="grimorio-book">
      <div class="grimorio-page-left">
        <div class="grimorio-img-wrap">
          <img id="grimorio-img" src="" alt="">
        </div>
        <div id="grimorio-badges" class="grimorio-badges"></div>
      </div>
      <div class="grimorio-page-right">
        <h3 id="grimorio-nombre" class="grimorio-nombre"></h3>
        <p id="grimorio-cientifico" class="grimorio-cientifico"></p>
        <div class="grimorio-seccion">
          <div class="grimorio-seccion-titulo">Descripción</div>
          <div id="grimorio-descripcion" class="grimorio-seccion-texto"></div>
        </div>
        <div class="grimorio-seccion">
          <div class="grimorio-seccion-titulo">Usos y preparación</div>
          <div id="grimorio-usos" class="grimorio-seccion-texto"></div>
        </div>
      </div>
      <div class="grimorio-nav">
        <button class="grimorio-nav-btn" onclick="cambiarPlanta(-1)" aria-label="Planta anterior">&#9668;</button>
        <span id="grimorio-contador" class="grimorio-nav-contador">Ficha 1 de 1</span>
        <button class="grimorio-nav-btn" onclick="cambiarPlanta(1)" aria-label="Planta siguiente">&#9658;</button>
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let currentTrackIndex = 0;
    let bgAudio = null;
    let modalAudio = null;
    let isMutedByUser = false;

    async function cargarPlaylist() {
      try {
        const res = await fetch('./public/Musica/playlist.json');
        if (res.ok) {
          playlist = await res.json();
        }
      } catch (e) {
        console.log("No se pudo cargar playlist.json:", e);
      }
      
      if (!playlist || playlist.length === 0) {
        playlist = [
          { titulo: "Morning in the Glen (Remix)", url: "./public/Musica/Morning%20in%20the%20Glen%20(Remix).mp3" }
        ];
      }
    }

    function initAudio() {
      if (!bgAudio && playlist.length > 0) {
        bgAudio = new Audio(playlist[0].url);
        bgAudio.loop = true;
        bgAudio.volume = 0.4;
      }
      
      const isModalAudioPlaying = modalAudio && !modalAudio.paused;
      if (!isModalAudioPlaying && !isMutedByUser && bgAudio && bgAudio.paused) {
        bgAudio.play().catch(e => console.log("Esperando interacción del usuario", e));
      }
    }

    function toggleAudio() {
      if (!bgAudio) initAudio();
      
      const btn = document.getElementById('toggle-audio-btn');
      if (bgAudio.paused) {
        isMutedByUser = false;
        if (!(modalAudio && !modalAudio.paused)) {
          bgAudio.play();
        }
        btn.textContent = "🔊";
        btn.setAttribute('aria-label', "Silenciar música de fondo");
      } else {
        isMutedByUser = true;
        bgAudio.pause();
        btn.textContent = "🔇";
        btn.setAttribute('aria-label', "Activar música de fondo");
      }
    }

    const localBaseUrl = "./public/Imagenes/Animacion-chimenea/"; 
    const maxPossibleFrames = 12; 
    const validFrames = [];

    const loadPromises = Array.from({ length: maxPossibleFrames }, (_, index) => {
      const frameNum = index + 1;
      return new Promise((resolve) => {
        const img = new Image();
        img.src = `${localBaseUrl}chimenea${frameNum}.png`;
        img.onload = () => resolve(img.src);
        img.onerror = () => resolve(null);
      });
    });

    Promise.all(loadPromises).then(results => {
      results.forEach(src => {
        if (src) validFrames.push(src);
      });
    });

    let currentFrameIndex = 0;
    const fireplaceElement = document.getElementById('fireplace-img');
    setInterval(() => {
      if (validFrames.length > 0) {
        currentFrameIndex = (currentFrameIndex + 1) % validFrames.length;
        fireplaceElement.src = validFrames[currentFrameIndex];
      }
    }, 120);

    const secciones = {
      herbolario: {
        titulo: "🌿 Herbolario",
        contenido: `
          <img src="./public/Imagenes/herbolario.png" alt="Herbolario" class="modal-img" onerror="console.error('Error al cargar la imagen del herbolario');">
          <p>Bienvenido al herbolario. Aquí encontrarás pócimas, hierbas curativas y remedios mágicos.</p>
          <button class="acercarse-btn" onclick="abrirHerbolarioScreen()">Acercarse</button>
        `
      },
      'pociones-tinturas': {
        titulo: "🧪 Pociones y Tinturas",
        contenido: `<p>Recetas y procesos para elaborar pociones, tinturas y elixires a partir de las hierbas recolectadas.</p>`
      },
      'enciclopedia-py': {
        titulo: "📖 Enciclopedia de Plantas Silvestres de Paraguay",
        contenido: `<p>Un compendio de plantas silvestres nativas de Paraguay, con sus nombres, hábitats y usos.</p>`
      },
      bosque: { titulo: "🌲 El Bosque", contenido: "<p>Contenido sobre permacultura...</p>" },
      fuego: { titulo: "🔥 Fuego", contenido: "<p>El calor del hogar.</p>" },
      musica: { titulo: "🎶 Música", esReproductor: true },
      conocimiento: { titulo: "📜 Conocimiento", contenido: "<p>Tarot y Tao.</p>" }
    };

    function loadTrack(index) {
      if (!modalAudio) {
        modalAudio = new Audio();
        modalAudio.volume = 0.7;
      }
      
      currentTrackIndex = (index + playlist.length) % playlist.length;
      modalAudio.src = playlist[currentTrackIndex].url;

      modalAudio.onerror = () => {
        console.error("No se pudo cargar el audio:", playlist[currentTrackIndex].url, modalAudio.error);
        const trackInfo = document.querySelector('.player-track-info');
        if (trackInfo) {
          trackInfo.textContent = `⚠️ No se pudo cargar: ${playlist[currentTrackIndex].titulo}`;
        }
      };
      
      modalAudio.onended = () => {
        changeTrack(1, true);
      };
    }

    function changeTrack(direction, forcePlay = false) {
      const wasPlaying = (modalAudio && !modalAudio.paused) || forcePlay;
      loadTrack(currentTrackIndex + direction);
      
      const trackInfo = document.querySelector('.player-track-info');
      const playBtn = document.querySelector('.player-btn-play');

      if (trackInfo) trackInfo.textContent = `🎵 ${playlist[currentTrackIndex].titulo}`;
      
      if (wasPlaying) {
        if (bgAudio) bgAudio.pause();
        modalAudio.play().catch(e => {
          console.error("Error al reproducir pista:", playlist[currentTrackIndex].url, e);
          if (trackInfo) trackInfo.textContent = `⚠️ No se pudo reproducir: ${playlist[currentTrackIndex].titulo}`;
        });
        if (playBtn) playBtn.textContent = '❚❚ Pause';
      } else {
        if (playBtn) playBtn.textContent = '► Play';
      }
    }

    function renderPlayerUI() {
      if (!modalAudio) {
        loadTrack(0);
      }

      const container = document.createElement('div');
      container.className = 'pixel-player';

      const trackInfo = document.createElement('div');
      trackInfo.className = 'player-track-info';
      trackInfo.textContent = `🎵 ${playlist[currentTrackIndex].titulo}`;

      const controlsRow = document.createElement('div');
      controlsRow.className = 'player-controls-row';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'player-btn';
      prevBtn.textContent = '◄◄';
      prevBtn.onclick = () => {
        changeTrack(-1);
      };

      const playBtn = document.createElement('button');
      playBtn.className = 'player-btn player-btn-play';
      playBtn.textContent = modalAudio.paused ? '► Play' : '❚❚ Pause';

      const nextBtn = document.createElement('button');
      nextBtn.className = 'player-btn';
      nextBtn.textContent = '►►';
      nextBtn.onclick = () => {
        changeTrack(1);
      };

      controlsRow.appendChild(prevBtn);
      controlsRow.appendChild(playBtn);
      controlsRow.appendChild(nextBtn);

      const volumeRow = document.createElement('div');
      volumeRow.className = 'player-volume-row';

      const volumeIcon = document.createElement('span');
      volumeIcon.className = 'volume-icon';
      volumeIcon.textContent = '🔊';

      const volumeSlider = document.createElement('input');
      volumeSlider.type = 'range';
      volumeSlider.min = '0';
      volumeSlider.max = '1';
      volumeSlider.step = '0.05';
      volumeSlider.value = modalAudio.volume;
      volumeSlider.className = 'player-slider';

      volumeRow.appendChild(volumeIcon);
      volumeRow.appendChild(volumeSlider);

      playBtn.onclick = () => {
        if (modalAudio.paused) {
          if (bgAudio) bgAudio.pause();
          modalAudio.play().catch(e => console.log("Error al reproducir:", e));
          playBtn.textContent = '❚❚ Pause';
        } else {
          modalAudio.pause();
          playBtn.textContent = '► Play';
        }
      };

      volumeSlider.oninput = (e) => {
        modalAudio.volume = e.target.value;
      };

      container.appendChild(trackInfo);
      container.appendChild(controlsRow);
      container.appendChild(volumeRow);

      return container;
    }

    function abrirSeccion(clave) {
      if (!secciones[clave]) return;
      
      const modalBody = document.getElementById('modal-body');
      document.getElementById('modal-title').innerHTML = secciones[clave].titulo;
      modalBody.innerHTML = ''; 
      
      if (secciones[clave].esReproductor) {
        modalBody.appendChild(renderPlayerUI());
      } else {
        modalBody.innerHTML = secciones[clave].contenido;
      }
      
      document.getElementById('modal').classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.remove('active');
      
      const isModalAudioPlaying = modalAudio && !modalAudio.paused;
      if (!isModalAudioPlaying && !isMutedByUser && bgAudio) {
        bgAudio.play().catch(() => {});
      }
    }

    function abrirHerbolarioScreen() {
      cerrarModal();
      document.getElementById('herbolario-screen').classList.add('active');
      panoramaCentrarAlAbrir = true;
      requestAnimationFrame(recalcPanoramaBounds);
    }

    function cerrarHerbolarioScreen() {
      document.getElementById('herbolario-screen').classList.remove('active');
      
      const isModalAudioPlaying = modalAudio && !modalAudio.paused;
      if (!isModalAudioPlaying && !isMutedByUser && bgAudio) {
        bgAudio.play().catch(() => {});
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cerrarModal();
        cerrarHerbolarioScreen();
        cerrarGrimorio();
      }
    });

    // --- Exploración en primera persona (drag-to-pan sobre imagen panorámica) ---
    let panoramaOffsetX = 0;
    let panoramaMinOffset = 0;
    let panoramaIsDragging = false;
    let panoramaDragMoved = false;
    let panoramaDragStartX = 0;
    let panoramaStartOffsetX = 0;
    let panoramaCentrarAlAbrir = true;

    function recalcPanoramaBounds() {
      const viewport = document.getElementById('herbolario-viewport');
      const layer = document.getElementById('herbolario-panorama-layer');
      if (!viewport || !layer) return;
      
      const viewportWidth = viewport.clientWidth;
      const layerWidth = layer.offsetWidth;

      panoramaMinOffset = Math.min(0, viewportWidth - layerWidth);

      if (panoramaCentrarAlAbrir && layerWidth > 0) {
        panoramaOffsetX = (viewportWidth - layerWidth) / 2;
        panoramaCentrarAlAbrir = false;
      }
      panoramaOffsetX = Math.min(0, Math.max(panoramaMinOffset, panoramaOffsetX));
      layer.style.transform = `translateX(${panoramaOffsetX}px)`;
    }

    function iniciarPanoramaDrag(e) {
      const viewport = document.getElementById('herbolario-viewport');
      panoramaIsDragging = true;
      panoramaDragMoved = false;
      panoramaDragStartX = e.clientX;
      panoramaStartOffsetX = panoramaOffsetX;
      viewport.classList.add('dragging');
      try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
    }

    function moverPanoramaDrag(e) {
      if (!panoramaIsDragging) return;
      const layer = document.getElementById('herbolario-panorama-layer');
      const delta = e.clientX - panoramaDragStartX;
      if (Math.abs(delta) > 6) panoramaDragMoved = true;
      panoramaOffsetX = Math.min(0, Math.max(panoramaMinOffset, panoramaStartOffsetX + delta));
      layer.style.transform = `translateX(${panoramaOffsetX}px)`;
    }

    function terminarPanoramaDrag() {
      panoramaIsDragging = false;
      document.getElementById('herbolario-viewport').classList.remove('dragging');
    }

    function bloquearClickSiHuboDrag(e) {
      if (panoramaDragMoved) {
        e.stopPropagation();
        e.preventDefault();
        panoramaDragMoved = false;
      }
    }

    window.addEventListener('load', async () => {
      await cargarPlaylist();
      document.addEventListener('click', initAudio, { once: true });

      const viewport = document.getElementById('herbolario-viewport');
      const paneles = document.querySelectorAll('.herbolario-panel');
      if (viewport) {
        viewport.addEventListener('pointerdown', iniciarPanoramaDrag);
        viewport.addEventListener('pointermove', moverPanoramaDrag);
        viewport.addEventListener('pointerup', terminarPanoramaDrag);
        viewport.addEventListener('pointercancel', terminarPanoramaDrag);
        viewport.addEventListener('click', bloquearClickSiHuboDrag, true);
      }
      paneles.forEach((panel) => {
        panel.addEventListener('load', recalcPanoramaBounds);
        if (panel.complete && panel.naturalWidth > 0) recalcPanoramaBounds();
      });
      window.addEventListener('resize', recalcPanoramaBounds);
    });

    // --- Grimorio de plantas medicinales ---
    // Cada planta va acá: imagen, nombre, científico, badges y textos.
    // Agregá tantas como quieras siguiendo el mismo formato.
    const plantas = [
      {
        imagen: "./public/Imagenes/Plantas/kaa-hee.jpg",
        nombre: "Kaa He'e",
        cientifico: "Stevia rebaudiana",
        badges: ["Digestivo", "Endulzante"],
        descripcion: "Arbusto nativo de Paraguay, de hojas dulces usadas tradicionalmente como edulcorante natural.",
        usos: "Infusión de hojas secas para regular el azúcar en sangre y aliviar molestias digestivas."
      },
      {
        imagen: "./public/Imagenes/Plantas/cocu.jpg",
        nombre: "Cocú",
        cientifico: "Allophylus edulis",
        badges: ["Antiinflamatorio"],
        descripcion: "Planta silvestre usada en la medicina tradicional guaraní para tratar afecciones respiratorias.",
        usos: "Decocción de hojas para inhalaciones o infusión como expectorante."
      },
      {
        imagen: "./public/Imagenes/Plantas/burrito.jpg",
        nombre: "Burrito",
        cientifico: "Aloysia polystachya",
        badges: ["Digestivo", "Relajante"],
        descripcion: "Hierba aromática común en huertas paraguayas, apreciada por su aroma y propiedades calmantes.",
        usos: "Infusión de hojas frescas o secas después de las comidas, o antes de dormir."
      }
    ];

    let plantaActualIndex = 0;

    function renderizarPlanta() {
      const p = plantas[plantaActualIndex];
      if (!p) return;

      const img = document.getElementById('grimorio-img');
      img.src = p.imagen;
      img.alt = p.nombre;

      document.getElementById('grimorio-nombre').textContent = p.nombre;
      document.getElementById('grimorio-cientifico').textContent = p.cientifico;
      document.getElementById('grimorio-descripcion').textContent = p.descripcion;
      document.getElementById('grimorio-usos').textContent = p.usos;

      const badgesWrap = document.getElementById('grimorio-badges');
      badgesWrap.innerHTML = '';
      (p.badges || []).forEach(b => {
        const span = document.createElement('span');
        span.className = 'grimorio-badge';
        span.textContent = b;
        badgesWrap.appendChild(span);
      });

      document.getElementById('grimorio-contador').textContent =
        `Ficha ${plantaActualIndex + 1} de ${plantas.length}`;
    }

    function cambiarPlanta(direccion) {
      plantaActualIndex = (plantaActualIndex + direccion + plantas.length) % plantas.length;
      renderizarPlanta();
    }

    function abrirGrimorio() {
      if (plantas.length === 0) return;
      plantaActualIndex = 0;
      renderizarPlanta();
      document.getElementById('grimorio-screen').classList.add('active');
    }

    function cerrarGrimorio() {
      document.getElementById('grimorio-screen').classList.remove('active');
    }
  </script>
</body>
</html>
